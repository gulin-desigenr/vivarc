<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Vivarc's app icon, on Apple's macOS icon grid: an 824px rounded square, the Vivarc logo's gradient, and a V drawn
       as one stroke whose right arm curls over like an arc (Vivaldi + Arc). -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7b6cf6"/>
      <stop offset="1" stop-color="#e86fb0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1030" flood-opacity="0.28"/>
    </filter>
    <filter id="mark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3a1d6e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <path d="M280 352 L452 690 Q474 734 496 690 L602 482 C662 364 742 360 752 420"
        fill="none" stroke="#fff" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" filter="url(#mark)"/>
</svg>
